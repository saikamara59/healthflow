name: Fly Deploy

# Auto-deploy the demo to Fly.io on every push to main. Skips paths that
# can't affect the deployed image (docs, plan/spec markdown, the React e2e
# tests, the agent test suites — those are CI-only, not bundled).
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'frontend/tests/**'
      - 'healthflow/tests/**'
      - 'healthflow/forensics/tests/**'
      - 'healthflow/agents/temporal_awareness/tests/**'

permissions:
  contents: read

# Only one deploy at a time. Cancels in-progress runs if a newer commit
# lands — the latest main is the only thing worth deploying.
concurrency:
  group: fly-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be  # 1.5

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --app healthflow-demo --build-secret HEALTHFLOW_AGENTS_TOKEN=${{ secrets.HEALTHFLOW_AGENTS_TOKEN }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Check deployed health and direct routes
        run: bash scripts/smoke_deployed_routes.sh
