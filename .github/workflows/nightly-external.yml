name: Nightly external services

# RxNav and NPPES can change without any HealthFlow commit (the NPPES
# query-string incident), so their live checks run every night, not only
# before a push. GitHub emails the repository owner when a scheduled run fails.
on:
  schedule:
    - cron: '23 10 * * *'  # 10:23 UTC, before the US workday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    name: RxNav and NPPES live checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install backend dependencies
        env:
          HEALTHFLOW_AGENTS_TOKEN: ${{ secrets.HEALTHFLOW_AGENTS_TOKEN }}
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: credential.https://github.com.helper
          GIT_CONFIG_VALUE_0: '!f() { echo username=x-access-token; echo "password=$HEALTHFLOW_AGENTS_TOKEN"; }; f'
        run: |
          if [ -z "$HEALTHFLOW_AGENTS_TOKEN" ]; then
            echo 'HEALTHFLOW_AGENTS_TOKEN is required for the private dependency.' >&2
            exit 1
          fi
          python -m pip install -r requirements.lock
      - name: Check live RxNav and NPPES
        env:
          LIVE_SMOKE_TESTS: '1'
        run: python -m pytest healthflow/tests/integration/ -v
