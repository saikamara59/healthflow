name: E2E Tests

# Pushes to main run this through release.yml, which deploys only if it passes.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (${{ matrix.browser }})
    # One runner per browser: a 2-core runner shared by three browsers and the
    # Docker stack starved WebKit, which then timed out on still-moving elements.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright
        working-directory: frontend
        env:
          CI: true
          ANTHROPIC_API_KEY: test-key-not-used
          JWT_SECRET: test-secret-for-e2e-only-not-production
          # All-zeros 32-byte test key (base64). Real prod uses a random key in secrets manager.
          PHI_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          EMAIL_PROVIDER: console
          FRONTEND_BASE_URL: https://test.example.com
          HEALTHFLOW_AGENTS_TOKEN: ${{ secrets.HEALTHFLOW_AGENTS_TOKEN }}
        run: npm run test:e2e -- --project=${{ matrix.browser }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}-${{ github.run_id }}
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload traces & videos on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-traces-${{ matrix.browser }}-${{ github.run_id }}
          path: frontend/test-results/
          retention-days: 14
