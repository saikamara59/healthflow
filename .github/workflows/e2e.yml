name: E2E Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (${{ matrix.browser }})
    # One runner per browser: a 2-core runner shared by three browsers and the
    # Docker stack starved WebKit, which then timed out on still-moving elements.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright
        working-directory: frontend
        env:
          CI: true
          ANTHROPIC_API_KEY: test-key-not-used
          JWT_SECRET: test-secret-for-e2e-only-not-production
          # All-zeros 32-byte test key (base64). Real prod uses a random key in secrets manager.
          PHI_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          EMAIL_PROVIDER: console
          FRONTEND_BASE_URL: https://test.example.com
          HEALTHFLOW_AGENTS_TOKEN: ${{ secrets.HEALTHFLOW_AGENTS_TOKEN }}
        run: npm run test:e2e -- --project=${{ matrix.browser }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: playwright-report-${{ matrix.browser }}-${{ github.run_id }}
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload traces & videos on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: playwright-traces-${{ matrix.browser }}-${{ github.run_id }}
          path: frontend/test-results/
          retention-days: 14
