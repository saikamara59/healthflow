name: CI

# Pushes to main run this through release.yml, which deploys only if it passes.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Backend lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install pinned Ruff
        # requirements-dev.txt includes the private backend dependency too.
        run: python -m pip install "$(grep '^ruff==' requirements-dev.txt)"
      - name: Lint backend
        run: ruff check healthflow/

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned gitleaks
        # Dependabot does not track this download; bump the version and checksum together
        # from the release's gitleaks_<version>_checksums.txt.
        run: |
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --silent --show-error --fail --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full history for secrets
        # --redact keeps any finding's value out of the public log. A real leak means
        # rotating the secret first; only then add its fingerprint to .gitleaksignore.
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .'

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install backend dependencies
        env:
          HEALTHFLOW_AGENTS_TOKEN: ${{ secrets.HEALTHFLOW_AGENTS_TOKEN }}
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: credential.https://github.com.helper
          GIT_CONFIG_VALUE_0: '!f() { echo username=x-access-token; echo "password=$HEALTHFLOW_AGENTS_TOKEN"; }; f'
        run: |
          if [ -z "$HEALTHFLOW_AGENTS_TOKEN" ]; then
            echo 'HEALTHFLOW_AGENTS_TOKEN is required for the private dependency.' >&2
            exit 1
          fi
          python -m pip install -r requirements.lock
      - name: Test backend
        run: python -m pytest healthflow/tests/ healthflow/agents/temporal_awareness/tests/ healthflow/forensics/tests/ -q --tb=short

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  deployment-guards:
    name: Deployment guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install pinned CI tooling
        run: python -m pip install -r requirements-ci.txt
      - name: Check deploy configuration
        run: python -m pytest tests/ci/test_deployment_guards.py -q

  harness-scripts:
    name: CI harness scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
      - name: Install pinned CI tooling
        run: python -m pip install -r requirements-ci.txt
      - name: Test deploy and lockfile scripts
        run: python -m pytest tests/ci/test_harness_scripts.py -q
      - name: Test the e2e stack setup
        working-directory: frontend
        run: npm run test:harness

  supply-chain:
    name: Release supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
      - name: Install pinned CI tooling
        run: python -m pip install -r requirements-ci.txt
      - name: Check pins and lockfiles
        run: python -m pytest tests/ci/test_supply_chain.py -q
      - name: Audit Python dependencies
        # The private healthflow-agents package is pinned to a commit and audited in its own repo.
        run: |
          ignores=$(grep -v '^#' security/pip-audit-allowlist.txt | awk -F'|' 'NF >= 3 { gsub(/ /, "", $1); printf "--ignore-vuln %s ", $1 }')
          grep -v 'git+' requirements.lock > "$RUNNER_TEMP/audit-requirements.txt"
          pip-audit -r "$RUNNER_TEMP/audit-requirements.txt" --no-deps --disable-pip --progress-spinner off $ignores
      - name: Audit shipped frontend dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
