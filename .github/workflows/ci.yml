name: CI

# Pushes to main run this through release.yml, which deploys only if it passes.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Backend lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned Ruff
        # requirements-dev.txt includes the private backend dependency too.
        run: python -m pip install "$(grep '^ruff==' requirements-dev.txt)"
      - name: Lint backend
        run: ruff check healthflow/

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install backend dependencies
        env:
          HEALTHFLOW_AGENTS_TOKEN: ${{ secrets.HEALTHFLOW_AGENTS_TOKEN }}
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: credential.https://github.com.helper
          GIT_CONFIG_VALUE_0: '!f() { echo username=x-access-token; echo "password=$HEALTHFLOW_AGENTS_TOKEN"; }; f'
        run: |
          if [ -z "$HEALTHFLOW_AGENTS_TOKEN" ]; then
            echo 'HEALTHFLOW_AGENTS_TOKEN is required for the private dependency.' >&2
            exit 1
          fi
          python -m pip install -r requirements.lock
      - name: Test backend
        run: python -m pytest healthflow/tests/ healthflow/agents/temporal_awareness/tests/ healthflow/forensics/tests/ -q --tb=short
      - name: Check pins, pinned Actions and the audit allowlist
        run: python -m pytest tests/ci -q --tb=short
      - name: Audit Python dependencies
        # The private healthflow-agents package is pinned to a commit and audited in its own repo.
        # Accepted vulnerabilities live in security/pip-audit-allowlist.txt with an expiry date.
        run: |
          python -m pip install "$(grep '^pip-audit==' requirements-ci.txt)"
          ignores=$(grep -v '^#' security/pip-audit-allowlist.txt | awk -F'|' 'NF >= 3 { gsub(/ /, "", $1); printf "--ignore-vuln %s ", $1 }')
          grep -v 'git+' requirements.lock > "$RUNNER_TEMP/audit-lock.txt"
          pip-audit -r "$RUNNER_TEMP/audit-lock.txt" --no-deps --disable-pip --progress-spinner off $ignores

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Audit shipped frontend dependencies
        run: npm audit --omit=dev --audit-level=high
